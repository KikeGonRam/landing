name: Modern CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  setup:
    name: 📦 Setup & Install
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'yarn'

      - name: 🛠️ Install Dependencies
        run: yarn install --frozen-lockfile

  quality:
    name: ✨ Code Quality (Lint & Types)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'yarn'

      - name: 🛠️ Install Dependencies
        run: yarn install --frozen-lockfile

      - name: 🧹 Run Linter
        run: yarn lint

  test:
    name: 🧪 Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'yarn'

      - name: 🛠️ Install Dependencies
        run: yarn install --frozen-lockfile

      - name: 🚀 Run Tests
        run: yarn test

  build:
    name: 🏗️ Production Build
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'yarn'

      - name: 🛠️ Install Dependencies
        run: yarn install --frozen-lockfile

      - name: 🔨 Build Project
        run: yarn build

      - name: 📦 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
